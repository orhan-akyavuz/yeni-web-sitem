<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem Arşivi | Matematik Dünyam</title>
  <meta name="description" content="Matematik Dünyam Haftanın Problemi arşivini yıl, konu ve zorluk seviyesine göre inceleyin." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">İçeriğe geç</a>
  <!-- INCLUDE HEADER -->
  <main id="main-content" class="weekly-archive-page" data-weekly-archive-page>
    <div class="container">
      <header class="weekly-archive-header">
        <p class="weekly-problem__eyebrow">Haftanın Problemi</p>
        <h1>Problem Arşivi</h1>
        <p>Geçmiş haftaların problemlerini konu, yıl ve zorluk seviyesine göre keşfet.</p>
      </header>
      <form class="weekly-archive-filters" data-archive-filters>
        <div class="form-field"><label class="form-label" for="archive-year">Yıl</label><input class="input" id="archive-year" name="year" inputmode="numeric" pattern="[0-9]{4}" placeholder="2026" /></div>
        <div class="form-field"><label class="form-label" for="archive-topic">Konu</label><input class="input" id="archive-topic" name="topic" placeholder="Örn. Cebir" /></div>
        <div class="form-field"><label class="form-label" for="archive-difficulty">Zorluk</label><select class="select" id="archive-difficulty" name="difficulty"><option value="">Tümü</option><option value="easy">Kolay</option><option value="medium">Orta</option><option value="hard">Zor</option></select></div>
        <button class="button button--secondary button--medium" type="submit">Filtrele</button>
      </form>
      <div class="weekly-archive-toolbar"><p data-archive-count aria-live="polite">Problemler yükleniyor...</p><button class="button button--text" type="button" data-archive-clear>Filtreleri temizle</button></div>
      <div class="weekly-archive-grid" data-archive-list aria-live="polite"><p>Arşiv yükleniyor...</p></div>
    </div>
  </main>
  <!-- INCLUDE FOOTER -->
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
